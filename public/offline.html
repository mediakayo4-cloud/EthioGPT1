<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EthioGPT — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0d0b;
        color: #f5f4f0;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        border: 1px solid rgba(245, 158, 11, 0.25);
        background: #121815;
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 18px;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #b7c2bc;
      }
      .langs {
        font-size: 0.85rem;
        color: #fbbf24;
        margin-bottom: 22px;
      }
      .status {
        min-height: 20px;
        margin-bottom: 14px;
        font-size: 0.82rem;
        color: #fca5a5;
      }
      button {
        background: #0f5132;
        color: #ffffff;
        border: 1px solid #10b981;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #146c43;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg" alt="EthioGPT" class="mark" />
      <h1>EthioGPT</h1>
      <p>
        You are currently offline. Reconnect to the internet to chat with EthioGPT, analyze images, or sync your saved history.
      </p>
      <div class="langs">
        Quunnamtiin intarneetii addaan citeera · ኢንተርኔት የለም · ኢንተርነት የለን · Internet ma jiro
      </div>
      <div id="retry-status" class="status" role="status"></div>
      <button id="retry-btn" type="button">Try Again</button>
    </main>

    <script>
      (function () {
        const btn = document.getElementById('retry-btn');
        const statusEl = document.getElementById('retry-status');

        async function retryConnection() {
          btn.disabled = true;
          btn.textContent = 'Checking connection...';
          statusEl.textContent = '';

          try {
            const res = await fetch('/api/health', { cache: 'no-store' });
            if (!res.ok) {
              throw new Error('Server returned HTTP ' + res.status);
            }

            // Clear any stale service worker registrations that may have cached offline.html
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }

            window.location.replace('/?recovered=' + Date.now());
          } catch (err) {
            statusEl.textContent =
              'Still unable to reach the EthioGPT server. Check your connection and try again.';
            btn.disabled = false;
            btn.textContent = 'Try Again';
          }
        }

        btn.addEventListener('click', retryConnection);
      })();
    </script>
  </body>
</html>
